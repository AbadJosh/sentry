[project]
name = "sentry-producer"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "confluent-kafka[avro]>=2.3.0",
    "websockets>=12.0",
    "pydantic-settings>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
