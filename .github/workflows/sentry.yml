name: Sentry CI → Deploy to Main

on:
  pull_request:
    paths:
      - 'producer/**'
      - 'consumer/**'
      - '.github/workflows/sentry.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  producer:
    name: Producer (ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: producer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install ruff
      - run: ruff check src/

  consumer:
    name: Consumer (ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: consumer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install ruff
      - run: ruff check src/

  deploy:
    name: Merge to Main
    needs: [producer, consumer]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.ref_name != 'main'
    steps:
      - uses: actions/checkout@v4

      - name: Squash-merge PR to main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge "${{ github.ref_name }}" --squash --delete-branch
