apiVersion: 1

datasources:
  - name: TimescaleDB
    type: postgres
    uid: timescaledb-sentry
    url: timescaledb:5432
    user: ${TIMESCALEDB_USER}
    secureJsonData:
      password: ${TIMESCALEDB_PASSWORD}
    jsonData:
      database: sentry
      sslmode: disable
      postgresVersion: 1600
      timescaledb: true
    isDefault: true
    editable: false
